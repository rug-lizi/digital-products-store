<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Adam Li Digital</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e5e5e5; line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* Login */
        #login { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: #141414; border: 1px solid #262626; border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; }
        .login-box h1 { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; text-align: center; }
        .login-box p { text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 24px; }
        .login-box input { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #333; border-radius: 10px; color: #e5e5e5; font-size: 0.95rem; margin-bottom: 16px; }
        .login-box input:focus { outline: none; border-color: #6366f1; }
        .login-box button { width: 100%; padding: 12px; background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        .login-box button:hover { opacity: 0.9; }
        .login-error { color: #ef4444; font-size: 0.85rem; text-align: center; margin-bottom: 12px; display: none; }

        /* Dashboard */
        #dashboard { display: none; }
        header { padding: 40px 0 20px; }
        header h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header .sub { color: #666; font-size: 0.85rem; }
        header .refresh { float: right; background: #1a1a2e; color: #a855f7; border: 1px solid #2a2a4e; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        header .refresh:hover { border-color: #6366f1; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; padding: 20px 0; }
        .stat-card { background: #141414; border: 1px solid #262626; border-radius: 12px; padding: 24px; }
        .stat-card .label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-card .value { font-size: 1.8rem; font-weight: 800; color: #fff; }
        .stat-card .value.green { color: #22c55e; }
        .stat-card .value.purple { color: #a855f7; }
        .stat-card .value.blue { color: #6366f1; }

        .section { padding: 20px 0; }
        .section h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; color: #ccc; }
        .table-wrap { background: #141414; border: 1px solid #262626; border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 16px; font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #262626; }
        td { padding: 12px 16px; font-size: 0.88rem; border-bottom: 1px solid #1a1a1a; }
        tr:last-child td { border-bottom: none; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.72rem; }
        .badge.view { background: #1a1a2e; color: #6366f1; }
        .badge.checkout { background: #2a2010; color: #f59e0b; }
        .badge.payment { background: #102a18; color: #22c55e; }
        .activity-time { color: #555; font-size: 0.78rem; }
        .empty { padding: 40px; text-align: center; color: #555; }

        footer { text-align: center; padding: 40px 0; color: #555; font-size: 0.8rem; border-top: 1px solid #1a1a1a; }

        @media (max-width: 700px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div id="login">
        <div class="login-box">
            <h1>🔐 Admin</h1>
            <p>Enter password to access dashboard</p>
            <div class="login-error" id="loginError">Invalid password</div>
            <input type="password" id="passwordInput" placeholder="Password" autofocus>
            <button onclick="login()">Login</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="container">
        <header>
            <button class="refresh" onclick="loadStats()">↻ Refresh</button>
            <h1>📊 Dashboard</h1>
            <div class="sub">Adam Li Digital — Traffic & Sales Monitor</div>
        </header>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="section">
            <h2>Per-Product Stats</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Product</th><th>Views</th><th>Checkouts</th><th>Sales</th><th>Revenue</th></tr>
                    </thead>
                    <tbody id="productRows"></tbody>
                </table>
            </div>
        </div>

        <div class="section">
            <h2>Recent Activity</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Type</th><th>IP</th><th>Details</th><th>Time</th></tr>
                    </thead>
                    <tbody id="activityRows"></tbody>
                </table>
            </div>
        </div>

        <footer>Admin Dashboard · Auto-refresh every 30s</footer>
    </div>

    <script>
        const passwordInput = document.getElementById('passwordInput');
        passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

        async function login() {
            const password = passwordInput.value;
            const errEl = document.getElementById('loginError');
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    showDashboard();
                } else {
                    errEl.textContent = data.error || 'Invalid password';
                    errEl.style.display = 'block';
                }
            } catch {
                errEl.style.display = 'block';
            }
        }

        function showDashboard() {
            document.getElementById('login').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadStats();
        }

        function fmtMoney(cents) {
            return '$' + (cents / 100).toFixed(2);
        }

        function fmtTime(ts) {
            const d = new Date(ts);
            return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function esc(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/admin/stats', { cache: 'no-store' });
                if (res.status === 401) { logout(); return; }
                const s = await res.json();

                // Stat cards
                const cards = [
                    { label: 'Page Views', value: s.pageViews || 0, cls: 'blue' },
                    { label: 'Unique Visitors', value: s.uniqueVisitors || 0, cls: 'purple' },
                    { label: 'Checkout Attempts', value: s.checkoutAttempts || 0, cls: '' },
                    { label: 'Completed Sales', value: s.completedSales || 0, cls: 'green' },
                    { label: 'Total Revenue', value: fmtMoney(s.revenue || 0), cls: 'green' },
                ];
                document.getElementById('statsGrid').innerHTML = cards.map(c =>
                    `<div class="stat-card"><div class="label">${c.label}</div><div class="value ${c.cls}">${c.value}</div></div>`
                ).join('');

                // Product stats
                const perProduct = s.perProduct || {};
                const productInfo = s.productInfo || {};
                const rows = Object.entries(perProduct).map(([priceId, st]) => {
                    const info = productInfo[priceId] || { name: priceId, icon: '' };
                    return `<tr>
                        <td>${esc(info.icon)} ${esc(info.name || priceId)}</td>
                        <td>${st.views || 0}</td>
                        <td>${st.checkouts || 0}</td>
                        <td>${st.sales || 0}</td>
                        <td>${fmtMoney(st.revenue || 0)}</td>
                    </tr>`;
                }).join('');
                document.getElementById('productRows').innerHTML = rows || '<tr><td colspan="5" class="empty">No product data yet</td></tr>';

                // Recent activity
                const events = s.recentEvents || [];
                const actRows = events.map(e => {
                    const badgeCls = e.type === 'page_view' ? 'view' : e.type === 'checkout_attempt' ? 'checkout' : 'payment';
                    const label = e.type === 'page_view' ? 'Page View' : e.type === 'checkout_attempt' ? 'Checkout' : 'Payment';
                    let details = '';
                    if (e.type === 'page_view') details = e.path || '';
                    else if (e.type === 'checkout_attempt') {
                        const info = productInfo[e.priceId] || {};
                        details = info.name || e.priceId || '';
                    } else if (e.type === 'payment_completed') {
                        const info = productInfo[e.priceId] || {};
                        details = `${info.name || e.priceId || ''} — ${fmtMoney(e.amount || 0)}`;
                    }
                    return `<tr>
                        <td><span class="badge ${badgeCls}">${label}</span></td>
                        <td>${esc(e.ip)}</td>
                        <td>${esc(details)}</td>
                        <td class="activity-time">${esc(fmtTime(e.ts))}</td>
                    </tr>`;
                }).join('');
                document.getElementById('activityRows').innerHTML = actRows || '<tr><td colspan="4" class="empty">No activity yet</td></tr>';
            } catch (err) {
                console.error('Failed to load stats:', err);
            }
        }

        async function logout() {
            await fetch('/api/admin/logout', { method: 'POST' });
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('login').style.display = 'flex';
            passwordInput.value = '';
        }

        // Reuse a valid HttpOnly session cookie without exposing it to JavaScript.
        fetch('/api/admin/stats', { cache: 'no-store' }).then((res) => {
            if (res.ok) showDashboard();
        });

        // Auto-refresh
        setInterval(() => {
            if (document.getElementById('dashboard').style.display !== 'none') loadStats();
        }, 30000);
    </script>
</body>
</html>
